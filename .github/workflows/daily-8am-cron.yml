name: Cron Job - Daily at 8 AM

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job started
        run: echo "Daily 8 AM job has started!"

      - name: Display current date and time
        run: date

      - name: Completion message
        run: echo "Daily job completed successfully!"
